services:
  - type: web
    name: dibs
    runtime: node
    plan: free
    region: frankfurt # same region as the Neon database (AWS eu-central-1)
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL # paste your Neon connection string
        sync: false
      - key: ADMIN_PASSWORD # pick one
        sync: false
      - key: SESSION_SECRET
        generateValue: true
